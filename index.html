<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>簿記所｜人事工作台</title>
<style>
:root{--green:#286b56;--dark:#22332d;--muted:#7c8984;--line:#e7eeea;--bg:#f5f8f6;--pale:#eaf4ef;--orange:#b77a35;--red:#b95f55}*{box-sizing:border-box}body{margin:0;color:var(--dark);background:var(--bg);font:14px/1.55 "Segoe UI","Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:white}.cover{background:linear-gradient(145deg,#205b48,#33785f);color:white;padding:8vh 8vw;display:flex;flex-direction:column;justify-content:space-between}.logo{font-size:16px;font-weight:700}.logo i{display:inline-grid;place-items:center;font-style:normal;background:#ffffff20;width:38px;height:38px;border-radius:12px;margin-right:10px}.cover h1{font-size:38px;line-height:1.4}.cover p,.cover small{color:#d5e9df}.login-side{display:grid;place-items:center;padding:30px}.login-box{width:min(100%,390px)}h1,h2,h3,p{margin-top:0}.login-box h2{font-size:26px;margin-bottom:6px}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:650;margin:16px 0 7px}input,select,textarea{width:100%;border:1px solid #dfe8e3;border-radius:9px;background:#fff;padding:11px 12px;color:var(--dark)}textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:9px;background:var(--green);color:white;font-weight:650;padding:11px 15px}.btn.full{width:100%;margin-top:20px}.btn.light{background:white;color:var(--green);border:1px solid var(--line)}.hint{padding:10px 12px;background:#f2f7f4;border-radius:8px;font-size:11px;color:var(--muted);margin-top:13px}.error{font-size:11px;color:var(--red);min-height:18px;margin-top:5px}.app{display:none;min-height:100vh;grid-template-columns:240px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}.sidebar .logo{padding:0 9px 24px;color:var(--dark)}.section-label{font-size:10px;letter-spacing:.12em;color:#9aa59f;padding:12px 10px 6px}.nav{display:grid;gap:3px}.nav button{text-align:left;border:0;border-radius:9px;background:transparent;padding:10px;color:#64716b;font-size:13px}.nav button.active{background:var(--pale);color:var(--green);font-weight:700}.account{margin-top:auto;border-top:1px solid var(--line);padding:15px 7px 0;display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dcebe4;color:var(--green);font-weight:700}.account small{display:block;color:var(--muted);font-size:10px}.account button{margin-left:auto;border:0;background:none;color:var(--green);font-size:11px}.main{padding:26px 34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:27px}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}.heading h1{font-size:25px;margin:3px 0}.heading p{margin:0;color:var(--muted);font-size:12px}.eyebrow{font-size:10px;letter-spacing:.13em;color:var(--green);font-weight:700}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 8px 23px #1f3d3108}.stat{grid-column:span 3;min-height:112px}.stat small{color:var(--muted)}.value{font-weight:750;font-size:26px;margin-top:6px}.wide{grid-column:span 8}.narrow{grid-column:span 4}.fullrow{grid-column:span 12}.card h3{font-size:14px;margin:0 0 13px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:10px;font-weight:550;color:#929e97;padding:8px;border-bottom:1px solid var(--line)}.table td{font-size:11px;padding:11px 8px;border-bottom:1px solid #eff3f0}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#fff3e6;color:var(--orange);font-size:10px}.pill.ok{background:#e9f4ee;color:#39775d}.pill.info{background:#edf1fa;color:#657eae}.actions{display:flex;gap:8px}.action{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px;font-size:10px}.action.primary{color:var(--green);border-color:#d2e4d9}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.tile{border:1px solid var(--line);border-radius:10px;padding:14px}.tile b{display:block;font-size:12px}.tile span{font-size:10px;color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:13px}.toolbar input,.toolbar select{max-width:230px;padding:8px 10px;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.span2{grid-column:span 2}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:24px;bottom:22px;padding:12px 16px;border-radius:9px;background:#263b32;color:white;font-size:12px;display:none}.toast.show{display:block}.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px}.inline{display:flex;gap:8px;align-items:center}
@media(max-width:850px){.app{grid-template-columns:200px 1fr}.main{padding:20px}.stat{grid-column:span 6}.wide,.narrow{grid-column:span 12}.tiles{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.login{grid-template-columns:1fr}.cover{display:none}.app{display:grid!important;grid-template-columns:1fr}.sidebar{display:none}.main{padding:17px}.stat{grid-column:span 6}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.heading{align-items:flex-start;gap:8px}.tiles{grid-template-columns:1fr}}
</style></head><body>
<section class="login" id="login"><div class="cover"><div class="logo"><i>簿</i>簿記所　人事管理</div><div><small>PEOPLE &amp; WORK</small><h1>讓每一天的<br>工作安排更清楚。</h1><p>出勤、表單、簽核與團隊資訊，<br>在一個簡單的工作空間裡掌握。</p></div><small>簿記所內部人事系統・展示版</small></div><div class="login-side"><form class="login-box" id="loginForm"><h2>登入工作空間</h2><p class="muted">選擇角色以查看對應的功能頁面。</p><label>角色</label><select id="role"><option>員工</option><option>行政</option><option>主管、經理</option><option>老闆</option></select><label>密碼</label><input id="password" type="password" maxlength="4" inputmode="numeric" placeholder="請輸入四位數密碼"><div class="error" id="error"></div><button class="btn full">登入</button><div class="hint">展示版：所有角色密碼皆為 <b>0000</b></div></form></div></section>
<div class="app" id="app"><aside class="sidebar"><div class="logo"><i>簿</i>簿記所</div><div id="nav"></div><div class="account"><div class="avatar" id="initial">林</div><div><b id="userName">林怡君</b><small id="userRole"></small></div><button id="logout">登出</button></div></aside><main class="main"><div class="top"><span>簿記所　/　人事工作台</span><span>展示版　・　資料不會保存</span></div><div id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const menus={
'員工':['工作總覽','出勤打卡','我的表單','請假餘額與紀錄','加班紀錄','外出紀錄','團隊行事曆','個人資料','我的任務'],
'行政':['工作總覽','員工資料','請假時數管理','加班時數管理','報表匯出','個人資料申請','補打卡申請','報帳申請'],
'主管、經理':['工作總覽','團隊請假與外出','團隊加班資訊','待簽核假單','待簽核外出單','待簽核加班單','團隊行事曆'],
'老闆':['工作總覽','全所資訊','員工資料與權限','表單與出勤紀錄']};
let currentRole='員工',currentPage='工作總覽';
function go(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===page));render();}
function nav(){const el=document.getElementById('nav');el.innerHTML='<div class="section-label">工作空間</div><div class="nav">'+menus[currentRole].map(x=>`<button class="${x===currentPage?'active':''}" data-page="${x}">${x}</button>`).join('')+(currentRole==='員工'?'<button data-page="新增申請">＋　新增申請</button>':'')+'</div>';el.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function heading(title,sub,button=''){return `<div class="heading"><div><div class="eyebrow">${currentRole.toUpperCase()}</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function table(headers,rows){return `<div style="overflow:auto"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
function dashboard(){let items=currentRole==='員工'?['剩餘特休','本月出勤','待處理表單','本月加班']:currentRole==='行政'?['在職員工','待處理申請','本月請假時數','本月加班時數']:currentRole==='主管、經理'?['團隊人數','待我簽核','今日請假','今日外出']:['員工總數','待簽核表單','本月出勤率','待處理事項'];let stats=items.map((x,i)=>`<article class="card stat"><small>${x}</small><div class="value">${currentRole==='員工'?['56 小時','12 天','2 件','6.5 小時'][i]:['24 人','3 件','5 人','2 件'][i]}</div><small>${currentRole==='員工'?'查看個人資訊':'查看明細'}</small></article>`).join('');let list=currentRole==='員工'?['特休申請　　06/20 全天','外出申請　　06/18 14:00','補打卡申請　06/11 下班']:['王小明　特休申請　06/20','陳怡安　外出申請　06/18','林志豪　加班申請　06/17'];return heading('早安，'+(currentRole==='員工'?'怡君':currentRole+'使用者')+' 👋','以下是你目前可使用的人事功能摘要。',currentRole==='員工'?'<button class="btn" onclick="go(\'新增申請\')">＋ 新增申請</button>':'')+`<div class="grid">${stats}<section class="card wide"><h3>${currentRole==='員工'?'最近的表單':'最近的申請與簽核'}</h3>${table(['項目','日期／期間','狀態','操作'],list.map(x=>`<tr><td>${x.split('　')[0]}</td><td>${x.split('　').slice(1).join(' ')}</td><td><span class="pill">${currentRole==='員工'?'簽核中':'待處理'}</span></td><td><button class="action" onclick="toastMsg('已開啟項目明細')">查看</button></td></tr>`).join(''))}</section><section class="card narrow"><h3>快速入口</h3><div class="tiles">${(currentRole==='員工'?['申請請假','申請外出','申請加班','申請報帳']:menus[currentRole].slice(1,4)).map(x=>`<button class="tile action" onclick="go('${currentRole==='員工'?'新增申請':x}')"><b>${x}</b><span>前往功能　→</span></button>`).join('')}</div></section></div>`}
function application(){return heading('新增申請','選擇表單類型並填寫資料，送出後會顯示展示用結果。')+`<section class="card"><form id="applyForm"><div class="form-grid"><div class="span2"><label>申請類型</label><select required id="type"><option value="">請選擇</option><option>請假單</option><option>外出單</option><option>加班單</option><option>報帳單</option><option>補打卡申請</option><option>個人資料修改</option></select></div><div><label>開始日期／時間</label><input type="datetime-local" required></div><div><label>結束日期／時間</label><input type="datetime-local"></div><div><label>假別（請假時填寫）</label><select><option>請選擇假別</option><option>特別休假</option><option>事假</option><option>病假</option><option>補休</option><option>其他</option></select></div><div><label>時數／金額</label><input type="number" min="0" placeholder="例如：2"></div><div class="span2"><label>事由或備註</label><textarea placeholder="請簡單說明申請原因"></textarea></div><div class="span2"><label>附件（展示欄位）</label><input type="file"></div></div><div class="form-actions"><button type="reset" class="btn light">清除</button><button class="btn">送出申請</button></div></form></section>`}
function render(){let c=document.getElementById('content');if(currentPage==='工作總覽')c.innerHTML=dashboard();else if(currentPage==='新增申請')c.innerHTML=application();else c.innerHTML=heading(currentPage,'此頁依角色提供對應的資料檢視與管理入口。')+`<section class="card"><div class="toolbar"><input placeholder="搜尋姓名、表單或關鍵字"><select><option>全部狀態</option><option>待簽核</option><option>已核准</option><option>已退回</option></select><button class="btn light" onclick="toastMsg('已套用篩選條件')">搜尋</button>${currentRole==='行政'&&currentPage==='報表匯出'?'<button class="btn" onclick="toastMsg(\'報表已準備（展示）\')">匯出報表</button>':''}</div>${table(['申請人／項目','日期','類型／內容','狀態','操作'],['王小明','陳怡安','林志豪'].map((n,i)=>`<tr><td>${n}</td><td>2025/06/${18+i}</td><td>${['特休 4 小時','外出洽公','加班 2 小時'][i]}</td><td><span class="pill ${i===1?'ok':''}">${i===1?'已核准':'待簽核'}</span></td><td><span class="actions"><button class="action" onclick="toastMsg('已查看明細')">查看</button>${['主管、經理','行政'].includes(currentRole)?'<button class="action primary" onclick="toastMsg(\'已完成展示用核准\')">核准</button>':''}</span></td></tr>`).join(''))}</section>`;const f=document.getElementById('applyForm');if(f)f.onsubmit=e=>{e.preventDefault();toastMsg('申請已送出（展示用，未儲存資料）');f.reset()}}
function toastMsg(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();if(document.getElementById('password').value!=='0000'){document.getElementById('error').textContent='密碼不正確，請輸入 0000。';return}currentRole=document.getElementById('role').value;currentPage='工作總覽';document.getElementById('login').style.display='none';document.getElementById('app').style.display='grid';document.getElementById('userRole').textContent=currentRole;document.getElementById('userName').textContent=currentRole==='員工'?'林怡君':currentRole+'使用者';document.getElementById('initial').textContent=currentRole==='員工'?'林':currentRole[0];nav();render()};document.getElementById('logout').onclick=()=>{document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid';document.getElementById('password').value=''};
</script>
<script>
// 依角色重新建立選單與畫面；每次切頁均檢查目前角色可用的頁面。
const pageAccess={
 '員工':['工作總覽','出勤打卡','我的表單','新增申請','請假餘額與紀錄','加班紀錄','外出紀錄','團隊行事曆','個人資料','我的任務'],
 '行政':['工作總覽','員工資料','請假時數管理','加班時數管理','報表匯出','個人資料申請','補打卡申請','報帳申請'],
 '主管、經理':['工作總覽','團隊請假與外出','團隊加班資訊','待簽核假單','待簽核外出單','待簽核加班單','團隊行事曆'],
 '老闆':['工作總覽','全所資訊','員工資料與權限','表單與出勤紀錄']
};
function nav(){const list=pageAccess[currentRole]||[];document.getElementById('nav').innerHTML='<div class="section-label">'+currentRole+'功能</div><div class="nav">'+list.map(x=>`<button class="${x===currentPage?'active':''}" data-page="${x}">${x==='新增申請'?'＋　':''}${x}</button>`).join('')+'</div>';document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function go(page){if(!(pageAccess[currentRole]||[]).includes(page)){toastMsg('目前角色沒有此功能的權限');return}currentPage=page;nav();render()}
function dashboard(){const isEmp=currentRole==='員工';const stats=isEmp?[['剩餘特休','56 小時','可用 7 天'],['補休餘額','6 小時','已使用 2 小時'],['本月出勤','12 / 20 天','出勤狀況良好'],['待處理表單','2 件','簽核中 1 件']]:[['員工人數','24 人','在職員工'],['待處理事項','3 件','依權限顯示'],['本月出勤','96%','全所統計'],['本月加班','42 小時','全所統計']];return heading(isEmp?'早安，怡君 👋':'早安，'+currentRole+'使用者','以下摘要與功能依你的角色權限顯示。',isEmp?'<button class="btn" onclick="go(\'新增申請\')">＋ 新增申請</button>':'')+`<div class="grid">${stats.map(s=>`<article class="card stat"><small>${s[0]}</small><div class="value">${s[1]}</div><small>${s[2]}</small></article>`).join('')}<section class="card wide"><h3>${isEmp?'我的近期表單':'待處理與近期紀錄'}</h3>${table(['項目','期間','狀態','操作'],[['特休申請','06/20 全天','簽核中'],['外出申請','06/18 14:00','已核准'],['補打卡申請','06/11 下班','行政確認中']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="pill ${r[2]==='已核准'?'ok':''}">${r[2]}</span></td><td><button class="action" onclick="toastMsg('已開啟表單明細')">查看</button></td></tr>`).join(''))}</section><section class="card narrow"><h3>${isEmp?'假別餘額':'角色功能提醒'}</h3>${isEmp?`<div class="tile"><b>特別休假　56 小時</b><span>已使用 24 / 80 小時</span></div><div class="tile" style="margin-top:8px"><b>補休　6 小時</b><span>已使用 2 / 8 小時</span></div><button class="action primary" style="margin-top:12px" onclick="go('請假餘額與紀錄')">查看全部假別與紀錄 →</button>`:`<p class="muted" style="font-size:12px">此工作台只顯示 ${currentRole} 可檢視與處理的項目。</p>`}</section></div>`}
function render(){const c=document.getElementById('content');if(!(pageAccess[currentRole]||[]).includes(currentPage)){currentPage='工作總覽';nav()}if(currentPage==='工作總覽'){c.innerHTML=dashboard();return}if(currentPage==='新增申請'){c.innerHTML=application();return}
 const rows=(values,allowActions=false)=>table(['員工／項目','日期','內容','狀態','操作'],values.map((v,i)=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td><span class="pill ${v[3]==='已核准'?'ok':''}">${v[3]}</span></td><td>${allowActions?`<span class="actions"><button class="action" onclick="toastMsg('已檢視明細')">查看</button><button class="action primary" onclick="toastMsg('已完成展示用核准')">核准</button></span>`:`<button class="action" onclick="toastMsg('已檢視明細')">查看</button>`}</td></tr>`).join(''));
 const personal=[['林怡君','06/20','特休 8 小時','簽核中'],['林怡君','06/18','外出洽公','已核准'],['林怡君','06/11','補打卡：下班','行政確認中']];let title=currentPage,body='';
 if(currentPage==='請假餘額與紀錄')body=`<div class="grid"><div class="card stat"><small>特別休假</small><div class="value">56 小時</div><small>已使用 24 / 80 小時</small></div><div class="card stat"><small>補休</small><div class="value">6 小時</div><small>已使用 2 / 8 小時</small></div><div class="card stat"><small>病假</small><div class="value">依規定</div><small>本年度已使用 4 小時</small></div><div class="card stat"><small>事假</small><div class="value">依規定</div><small>查看公司規章</small></div><section class="card fullrow"><h3>我的請假紀錄</h3>${rows(personal.filter(x=>x[2].includes('特休')||x[2].includes('假')))}</section></div>`;
 else if(currentPage==='出勤打卡')body=`<div class="grid"><section class="card narrow"><h3>今日出勤</h3><p>上班時間　—</p><p>下班時間　—</p><button class="btn" onclick="toastMsg('上班打卡完成（展示用）')">打上班卡</button> <button class="btn light" onclick="toastMsg('下班打卡完成（展示用）')">打下班卡</button></section><section class="card wide"><h3>補打卡申請</h3><p class="muted">漏打卡時，填寫日期、班別與原因送交行政確認。</p><button class="btn" onclick="go('新增申請')">前往補打卡申請</button></section></div>`;
