<style>

@media(max-width:850px){.app{grid-template-columns:200px 1fr}.main{padding:20px}.stat{grid-column:span 6}.wide,.narrow{grid-column:span 12}.tiles{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.login{grid-template-columns:1fr}.cover{display:none}.app{display:grid!important;grid-template-columns:1fr}.sidebar{display:none}.main{padding:17px}.stat{grid-column:span 6}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.heading{align-items:flex-start;gap:8px}.tiles{grid-template-columns:1fr}}
.nav button{display:flex;align-items:center;gap:12px}.nav-icon{width:18px;flex:none;text-align:center;font-size:16px;color:#71857a}.nav button.active .nav-icon{color:var(--green)}.right-stack{grid-column:span 4;display:grid;gap:15px;align-content:start}.right-stack .card{padding:18px}.quick-card{grid-column:span 8}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.quick-item{min-width:0;border:1px solid var(--line);border-radius:11px;padding:12px 10px;display:flex;align-items:center;gap:9px;background:#fff;transition:transform .16s,border-color .16s,box-shadow .16s}.quick-item:hover{transform:translateY(-2px);border-color:#bfd8ca;box-shadow:0 8px 18px #1f3d310c}.quick-ico{width:34px;height:34px;flex:none;border-radius:10px;background:#eaf4ef;color:var(--green);display:grid;place-items:center;font-size:16px}.quick-item:nth-child(4n+2) .quick-ico{background:#fff3e6;color:#b77a35}.quick-item:nth-child(4n+3) .quick-ico{background:#edf1fa;color:#6482b0}.quick-item:nth-child(4n+4) .quick-ico{background:#e8f4f2;color:#438c82}.quick-copy{min-width:0}.quick-copy b{display:block;font-size:11px;white-space:nowrap}.quick-copy small{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calendar-card{padding:18px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.calendar-head h3{margin:0;font-size:14px}.calendar-head p{margin:3px 0 0;color:var(--muted);font-size:10px}.calendar-controls{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.calendar-nav{width:24px;height:24px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--green);font-size:17px;line-height:1}.calendar-nav:hover{background:var(--pale)}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}.calendar-grid span{min-height:26px;display:grid;place-items:center;font-size:10px}.calendar-grid .cal-weekday{min-height:22px;color:#87938d}.cal-day{position:relative;border-radius:50%;color:#56645d}.cal-day.has-event{background:#eaf4ef;color:var(--green);font-weight:700}.cal-day.has-event:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#e4a15f;bottom:2px;left:calc(50% - 2px)}.cal-day.is-today{outline:1px solid var(--green);outline-offset:1px}.calendar-events{display:grid;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid #eff3f0}.calendar-event{display:flex;align-items:center;gap:7px;font-size:10px;color:#66736c}.event-dot{width:7px;height:7px;border-radius:50%;background:#83ad98;flex:none}.event-dot.blue{background:#8ca4c7}.calendar-empty-note{font-size:10px;color:var(--muted)}.calendar-full{grid-column:span 12;max-width:740px}.calendar-full .calendar-grid span{min-height:42px;font-size:12px}.calendar-full .calendar-grid .cal-weekday{min-height:28px}.calendar-full .calendar-events{gap:9px;margin-top:15px;padding-top:13px}.calendar-full .calendar-event{font-size:12px}@media(max-width:850px){.right-stack,.quick-card{grid-column:span 12}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.quick-grid{grid-template-columns:1fr 1fr}.calendar-full .calendar-grid span{min-height:34px}}

<style>

</style></head><body>
<section class="login" id="login"><div class="cover"><div class="logo"><i>簿</i>簿記所　人事管理</div><div><small>PEOPLE &amp; WORK</small><h1>讓每一天的<br>工作安排更清楚。</h1><p>出勤、表單、簽核與團隊資訊，<br>在一個簡單的工作空間裡掌握。</p></div><small>簿記所內部人事系統・展示版</small></div><div class="login-side"><form class="login-box" id="loginForm"><h2>登入工作空間</h2><p class="muted">選擇角色以查看對應的功能頁面。</p><label>角色</label><select id="role"><option>員工</option><option>行政</option><option>主管、經理</option><option>老闆</option></select><label>密碼</label><input id="password" type="password" maxlength="4" inputmode="numeric" placeholder="請輸入四位數密碼"><div class="error" id="error"></div><button class="btn full">登入</button><div class="hint">展示版：所有角色密碼皆為 <b>0000</b></div></form></div></section>
<div class="app" id="app"><aside class="sidebar"><div class="logo"><i>簿</i>簿記所</div><div id="nav"></div><div class="account"><div class="avatar" id="initial">林</div><div><b id="userName">林怡君</b><small id="userRole"></small></div><button id="logout">登出</button></div></aside><main class="main"><div class="top"><span>簿記所　/　人事工作台</span><span>展示版　・　資料不會保存</span></div><div id="content"></div></main></div><div class="toast" id="toast"></div>
<script>
const menus={
'員工':['工作總覽','出勤打卡','我的表單','請假餘額與紀錄','加班紀錄','外出紀錄','團隊行事曆','個人資料','我的任務'],
'行政':['工作總覽','員工資料','請假時數管理','加班時數管理','報表匯出','個人資料申請','補打卡申請','報帳申請'],
'主管、經理':['工作總覽','團隊請假與外出','團隊加班資訊','待簽核假單','待簽核外出單','待簽核加班單','團隊行事曆'],
'老闆':['工作總覽','全所資訊','員工資料與權限','表單與出勤紀錄']};
let currentRole='員工',currentPage='工作總覽';
let calendarYear=2025,calendarMonth=5;
let attendanceClock={checkIn:'尚未打卡',checkOut:'尚未打卡'},taskDone=false;
function recordAttendance(key){attendanceClock[key]=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});render()}
function openQuickApplication(label){const formType={'申請請假':'請假單','申請外出':'外出單','申請加班':'加班單','申請報帳':'報帳單'}[label];go('新增申請');const typeField=document.getElementById('type');if(typeField&&formType)typeField.value=formType}
const menuIcons={'工作總覽':'▦','出勤打卡':'◷','我的表單':'▤','請假餘額與紀錄':'☼','加班紀錄':'◷','外出紀錄':'↗','團隊行事曆':'▣','個人資料':'▧','我的任務':'▨','新增申請':'＋','員工資料':'♙','請假時數管理':'☼','加班時數管理':'◷','報表匯出':'▤','個人資料申請':'▧','補打卡申請':'◷','報帳申請':'＄','團隊請假與外出':'↗','團隊加班資訊':'◷','待簽核假單':'✓','待簽核外出單':'✓','待簽核加班單':'✓','全所資訊':'▦','員工資料與權限':'♙','表單與出勤紀錄':'▤','申請請假':'☼','申請外出':'↗','申請加班':'◷','申請報帳':'＄'};
function go(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent===page));render();}
function nav(){const el=document.getElementById('nav');el.innerHTML='<div class="section-label">工作空間</div><div class="nav">'+menus[currentRole].map(x=>`<button class="${x===currentPage?'active':''}" data-page="${x}">${x}</button>`).join('')+(currentRole==='員工'?'<button data-page="新增申請">＋　新增申請</button>':'')+'</div>';el.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function heading(title,sub,button=''){return `<div class="heading"><div><div class="eyebrow">${currentRole.toUpperCase()}</div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function table(headers,rows){return `<div style="overflow:auto"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`}
function calendarPanel(compact=false){const monthStart=new Date(calendarYear,calendarMonth,1),startDay=monthStart.getDay(),days=new Date(calendarYear,calendarMonth+1,0).getDate(),monthLabel=`${calendarYear} 年 ${calendarMonth+1} 月`;const cells=Array(startDay).fill('<span class="cal-empty"></span>').join('')+Array.from({length:days},(_,i)=>{const day=i+1,key=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,events=calendarEventsFor(key),today=new Date(),isToday=today.getFullYear()===calendarYear&&today.getMonth()===calendarMonth&&today.getDate()===day;return `<span class="cal-day ${events.length?'has-event':''} ${isToday?'is-today':''}" title="${events.map(e=>e.label).join('、')}">${day}</span>`}).join('');const monthEvents=Object.entries(teamCalendarEvents).map(([key])=>[key,calendarEventsFor(key)]).filter(([key,events])=>key.startsWith(`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-`)&&events.length).map(([key,events])=>`<div class="calendar-event"><i class="event-dot ${events[0].tone}"></i><span>${Number(key.slice(-2))} 日　${events.map(e=>e.label).join('、')}</span></div>`).join('')||'<div class="calendar-empty-note">本月目前沒有團隊行程</div>';return `<section class="card calendar-card ${compact?'narrow calendar-compact':'calendar-full'}"><div class="calendar-head"><div><h3>團隊行事曆</h3>${compact?'':`<p>團隊請假與外出安排</p>`}</div><div class="calendar-controls"><button class="calendar-nav" aria-label="上個月" onclick="changeCalendarMonth(-1)">‹</button><b>${monthLabel}</b><button class="calendar-nav" aria-label="下個月" onclick="changeCalendarMonth(1)">›</button></div></div><div class="calendar-grid">${['日','一','二','三','四','五','六'].map(d=>`<span class="cal-weekday">${d}</span>`).join('')}${cells}</div><div class="calendar-events">${monthEvents}</div></section>`}
function changeCalendarMonth(delta){calendarMonth+=delta;if(calendarMonth<0){calendarMonth=11;calendarYear--}else if(calendarMonth>11){calendarMonth=0;calendarYear++}render()}
